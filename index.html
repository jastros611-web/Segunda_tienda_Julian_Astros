<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tienda</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(0, 200, 255, 0.12), transparent 25%),
        radial-gradient(circle at 85% 10%, rgba(130, 70, 255, 0.14), transparent 25%),
        #080b14;
      color: #e8edf7;
      padding: 0;
      margin: 0;
      text-align: center;
      min-height: 100vh;
    }

    /* =========================
       ENCABEZADO
    ========================= */

    h1 {
      margin: 0;
      padding: 55px 20px 8px;

      font-size: 52px;
      font-weight: 900;
      letter-spacing: 3px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #070a12 0%,
          #111b38 45%,
          #24145c 100%
        );

      text-shadow:
        0 0 10px rgba(0, 200, 255, 0.5),
        0 0 25px rgba(110, 70, 255, 0.35);

      border-bottom: 1px solid rgba(0, 210, 255, 0.25);
    }

    .slogan {
      margin: 0;
      padding: 5px 20px 45px;

      font-size: 18px;
      letter-spacing: 1px;

      color: #aebbd5;

      background:
        linear-gradient(
          135deg,
          #070a12,
          #111b38,
          #24145c
        );
    }

    /* =========================
       BARRA DE BENEFICIOS
    ========================= */

    .beneficios {
      display: flex;
      justify-content: center;
      gap: 35px;
      flex-wrap: wrap;

      padding: 17px;

      background: rgba(8, 12, 25, 0.95);

      border-top: 1px solid rgba(0, 210, 255, 0.15);
      border-bottom: 1px solid rgba(110, 70, 255, 0.25);

      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.35);
    }

    .beneficios span {
      font-size: 14px;
      font-weight: 600;
      color: #cbd6eb;

      transition: 0.2s;
    }

    .beneficios span:hover {
      color: #61e7ff;
      text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
    }

    /* =========================
       CATÁLOGO
    ========================= */

    #productos {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 28px;

      padding: 45px 25px;
    }

    /* =========================
       PRODUCTOS
    ========================= */

    .producto {
      position: relative;

      width: 235px;
      padding: 12px;

      background:
        linear-gradient(
          145deg,
          #121827,
          #0d111d
        );

      border: 1px solid rgba(100, 130, 180, 0.25);
      border-radius: 12px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35),
        inset 0 1px rgba(255, 255, 255, 0.03);

      transition:
        transform 0.25s,
        border-color 0.25s,
        box-shadow 0.25s;
    }

    .producto:hover {
      transform: translateY(-8px);

      border-color: rgba(0, 210, 255, 0.55);

      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.5),
        0 0 18px rgba(0, 180, 255, 0.12);
    }

    .producto img {
      width: 100%;
      height: 155px;

      object-fit: cover;

      border-radius: 8px;

      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .producto h3 {
      margin: 13px 0 8px;

      color: #ffffff;

      font-size: 18px;
    }

    .descripcion {
      font-size: 14px;
      color: #8f9bb2;

      min-height: 42px;
    }

    .precio {
      font-size: 20px;
      font-weight: 800;

      color: #5de4ff;

      text-shadow: 0 0 8px rgba(0, 210, 255, 0.25);
    }

    /* =========================
       BOTÓN COMPRAR
    ========================= */

    .producto button {
      width: 100%;

      background:
        linear-gradient(
          90deg,
          #087f9d,
          #3154c8
        );

      border: 1px solid rgba(90, 225, 255, 0.35);

      color: white;

      padding: 11px 15px;
      margin-top: 8px;

      border-radius: 6px;

      cursor: pointer;

      font-weight: 700;

      transition: 0.2s;
    }

    .producto button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 0 15px rgba(0, 200, 255, 0.35);

      filter: brightness(1.15);
    }

    /* =========================
       CARRITO
    ========================= */

    .carrito {
      margin: 20px auto 50px;

      padding: 25px;

      background:
        linear-gradient(
          145deg,
          #121827,
          #0c101b
        );

      border: 1px solid rgba(100, 130, 180, 0.25);

      border-radius: 14px;

      text-align: left;

      display: block;

      max-width: 520px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.45);
    }

    .carrito h2 {
      margin-top: 0;

      color: white;

      border-bottom: 1px solid rgba(255, 255, 255, 0.08);

      padding-bottom: 12px;
    }

    #lista-carrito {
      padding-left: 20px;
    }

    #lista-carrito li {
      margin-bottom: 9px;
      color: #b9c4d8;
    }

    .resumen {
      border-top: 1px solid rgba(255, 255, 255, 0.1);

      margin-top: 18px;

      padding-top: 12px;
    }

    .total {
      font-size: 21px;

      font-weight: 800;

      color: #5de4ff;
    }

    /* =========================
       BOTONES DEL CARRITO
    ========================= */

    .vaciar,
    .finalizar {
      border: none;

      color: white;

      padding: 10px 15px;

      margin-top: 10px;

      border-radius: 6px;

      cursor: pointer;

      font-weight: 700;

      transition: 0.2s;
    }

    .vaciar {
      background: #b52d45;
    }

    .finalizar {
      background:
        linear-gradient(
          90deg,
          #087f9d,
          #3154c8
        );

      margin-left: 5px;
    }

    .vaciar:hover,
    .finalizar:hover {
      transform: translateY(-2px);

      filter: brightness(1.15);
    }

    /* =========================
       EFECTO GENERAL
    ========================= */

    button:active {
      transform: scale(0.97);
    }

    /* =========================
       MÓVIL
    ========================= */

    @media (max-width: 600px) {

      h1 {
        font-size: 38px;
      }

      .beneficios {
        gap: 15px;
      }

      .producto {
        width: 90%;
        max-width: 300px;
      }

      .carrito {
        width: 85%;
      }

  </style>
</head>
<body>
  <h1>🎮 Next Level-Julian Astros</h1>

  <p class="slogan">
    Lleva tu experiencia al siguiente nivel🌎
  </p>

  <div class="beneficios">
    <span>🚚 Envíos en Bogotá</span>
    <span>🔒 Compra segura</span>
    <span>📦 Seguimiento de pedido</span>
  </div>

  <div id="productos"></div>

  <div class="carrito">
    <h2>🧾 Carrito de Compras</h2>

    <ul id="lista-carrito"></ul>

    <div class="resumen">
      <p>
        Envío: <strong>Gratis</strong>
      </p>

      <p class="total">
        Total: $<span id="total">0</span>
      </p>
    </div>

    <button class="vaciar" onclick="vaciarCarrito()">
      🧼 Vaciar Carrito
    </button>

    <button class="finalizar" onclick="finalizarCompra()">
      ✅ Finalizar Compra
    </button>
  </div>

  <script>
    const productos = [
      {
        id: 1,
        nombre: "Sony Control Dualsense PS5",
        descripcion: "Un control ergonomico para tus necesidades.",
        precio: 25000,
        imagen: "https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcS-h-bUHTiC6SB-92u8zT58TYYY4C17oLTT71HhQYOYYZaHeoDMQlof2lfrlgGZkdOTyd22f6caTjnNrmo7Tg4hfW-zIc86FTTz-oZaNq6i27uJ9KvhnNsNgZI"
      },
      {
        id: 2,
        nombre: "Mouse Ergonomico Vertical Inalambrico",
        descripcion: "Disfruta de tu mouse evitando dolores",
        precio: 18000,
        imagen: "https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcSJevP5hrklzNpxAxggnRyaZGCuRHHSfoHKzWYQh765-9CHmBOefL-JuXgbbSXF8_ofI_sdjfHm9If70KA5-15Wa2BT3Q1KZiAiS55Wiy7dXs73wwjRi0Is"
      },
      {
        id: 3,
        nombre: "Audiculares gamer",
        descripcion: "Disfruta de experiencias sensoriales como ninguna otra",
        precio: 30000,
        imagen: "https://i.blogs.es/25be06/auricularesjugonesap/1366_2000.jpg"
      },
      {
        id: 4,
        nombre: "Teclado gamer",
        descripcion: "Siente la Exoeriencia completa del gamer",
        precio: 18000,
        imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR62XwYWHi9UkLhQXg4wMqrJEzF0_yBA-XDf7Q9b_pLija_WBIsoImr-lM&s=10"
      },
      {
        id: 5,
        nombre: "Mochila Gamer",
        descripcion: "Para traer todo contigo, todo el tiempo",
        precio: 22000,
        imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQENpGOIMbfrBNHX5qksFZOCUxw09KaHgf6QikVxcGFd6_FvFh8NVpS3-M&s=10"
      }
    ];


    /* ==============================
       CARRITO
    ================================ */

    const carrito = [];

    const contenedorProductos = document.getElementById("productos");
    const listaCarrito = document.getElementById("lista-carrito");
    const totalCarrito = document.getElementById("total");


    /* ==============================
       MOSTRAR PRODUCTOS
    ================================ */

    function mostrarProductos() {

      contenedorProductos.innerHTML = "";

      productos.forEach(prod => {

        const div = document.createElement("div");

        div.className = "producto";

        div.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}">

          <h3>${prod.nombre}</h3>

          <p class="descripcion">
            ${prod.descripcion}
          </p>

          <p class="precio">
            ${prod.precio.toLocaleString("es-CO", {
              style: "currency",
              currency: "COP",
              minimumFractionDigits: 0
            })}
          </p>

          <button onclick="agregarAlCarrito(${prod.id})">
            Agregar al carrito
          </button>
        `;

        contenedorProductos.appendChild(div);

      });

    }


    /* ==============================
       AGREGAR AL CARRITO
    ================================ */

    function agregarAlCarrito(id) {

      const productoExistente =
        carrito.find(p => p.id === id);

      if (productoExistente) {

        productoExistente.cantidad++;

      } else {

        const producto =
          productos.find(p => p.id === id);

        carrito.push({
          ...producto,
          cantidad: 1
        });

      }

      actualizarCarrito();

    }


    /* ==============================
       ACTUALIZAR CARRITO
    ================================ */

    function actualizarCarrito() {

      listaCarrito.innerHTML = "";

      let total = 0;
      let totalItems = 0;

      carrito.forEach(item => {

        const li =
          document.createElement("li");

        const subtotal =
          item.precio * item.cantidad;

        li.textContent =
          `${item.nombre} x${item.cantidad} — ` +
          subtotal.toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            minimumFractionDigits: 0
          });

        listaCarrito.appendChild(li);

        total += subtotal;
        totalItems += item.cantidad;

      });

      totalCarrito.textContent =
        total.toLocaleString("es-CO");

      actualizarTituloCarrito(totalItems);

    }


    /* ==============================
       CONTADOR DEL CARRITO
    ================================ */

    function actualizarTituloCarrito(cantidad) {

      const titulo =
        document.querySelector(".carrito h2");

      titulo.textContent =
        `🧾 Carrito de Compras (${cantidad})`;

    }


    /* ==============================
       VACIAR CARRITO
    ================================ */

    function vaciarCarrito() {

      if (carrito.length === 0) {

        alert("🛒 El carrito ya está vacío.");

        return;

      }

      if (
        confirm(
          "¿Estás seguro de que quieres vaciar el carrito?"
        )
      ) {

        carrito.length = 0;

        actualizarCarrito();

      }

    }


    /* ==============================
       FINALIZAR COMPRA
    ================================ */

    function finalizarCompra() {

      if (carrito.length === 0) {

        alert(
          "🛒 Tu carrito está vacío. Agrega productos antes de finalizar la compra."
        );

        return;

      }

      alert(
        "🎉 ¡Pedido simulado confirmado!\n\n" +
        "En un eCommerce real, ahora entrarían en acción " +
        "el backend, la pasarela de pago y la logística."
      );

      carrito.length = 0;

      actualizarCarrito();

    }


    /* ==============================
       INICIAR TIENDA
    ================================ */

    mostrarProductos();
  </script>
</body>
</html>
